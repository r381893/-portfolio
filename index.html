<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>r381893 · 工具台</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◆</text></svg>" />
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <header class="hero">
    <p class="eyebrow">r381893</p>
    <h1 class="brand">工具台</h1>
    <p class="lede">個人工具入口。交易回測、工程表單、日常小工具，都從這裡進去。</p>
    <div class="hero-actions">
      <a class="btn primary" href="https://r381893.github.io/tw-etf-backtest/">打開 ETF 回測</a>
      <a class="btn ghost" href="#tools">看全部工具</a>
    </div>
  </header>

  <main id="tools" class="tools">
    <div class="section-head">
      <h2>工具分頁</h2>
      <p>之後新做的頁面會加在這裡，當成主站的分支入口。</p>
    </div>

    <div class="filters" role="tablist" aria-label="工具分類">
      <button type="button" class="chip active" data-filter="all">全部</button>
      <button type="button" class="chip" data-filter="finance">交易／資產</button>
      <button type="button" class="chip" data-filter="work">工作</button>
      <button type="button" class="chip" data-filter="other">其他</button>
    </div>

    <div class="tool-list" id="toolList"></div>
  </main>

  <footer class="foot">
    <p>GitHub：<a href="https://github.com/r381893">@r381893</a>
      · 現行回測：<a href="https://github.com/r381893/tw-etf-backtest">tw-etf-backtest</a></p>
  </footer>

  <script src="projects.js"></script>
  <script src="app.js"></script>
